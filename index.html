<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>반려동물 진드기 체크 이벤트</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- Tween.js (부드러운 카메라 이동 애니메이션용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #e2e8f0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 430px;
            max-height: 932px;
            background-color: #f3f4f6;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .pointer-events-auto { pointer-events: auto; }
        
        /* 팝업 및 페이드 애니메이션 */
        .pop-up { animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popUp {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .fade-in { animation: fadeIn 0.5s forwards; }
        .fade-out { animation: fadeOut 0.5s forwards; pointer-events: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        /* 진드기 마커 맥박 효과 */
        .pulse-text { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); color: #ef4444; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div id="canvas-container"></div>

        <div class="ui-layer" id="ui-layer">
            
            <!-- 0. 로딩 화면 (이제 모델이 즉시 생성되므로 바로 사라지게 처리됨) -->
            <div id="loading-ui" class="pointer-events-auto flex flex-col items-center justify-center w-full h-full bg-black/70 backdrop-blur-md p-6 text-center z-50 absolute">
                <div class="animate-spin rounded-full h-14 w-14 border-t-4 border-b-4 border-orange-400 mb-4"></div>
                <p class="text-white font-bold text-lg">3D 환경 준비 중... 🐕</p>
            </div>

            <!-- 1. 시작 화면 -->
            <div id="start-screen" class="pointer-events-auto flex flex-col items-center justify-center w-full h-full bg-black/40 backdrop-blur-sm p-6 text-center hidden">
                <div class="bg-white/90 p-6 rounded-2xl shadow-2xl mb-8 pop-up max-w-xs w-full border-t-4 border-orange-400">
                    <h1 class="text-2xl font-black text-gray-800 mb-2">진드기 집중 체크!</h1>
                    <p class="text-gray-600 text-sm">산책 후 우리 강아지의<br>어디를 확인해야 할까요?</p>
                </div>
                <div class="flex flex-col gap-3 w-full max-w-xs pop-up" style="animation-delay: 0.2s;">
                    <button id="start-btn" class="w-full bg-gradient-to-r from-orange-400 to-rose-400 text-white font-bold py-4 px-6 rounded-full shadow-lg text-lg hover:scale-105 transition-transform">
                        ▶ 기본 모델로 시작
                    </button>
                    <button id="upload-btn" class="w-full bg-white text-orange-500 font-bold py-3 px-6 rounded-full shadow-lg text-md border-2 border-orange-400 hover:bg-orange-50 transition-colors">
                        📁 내 3D 모델(GLB) 불러오기
                    </button>
                    <input type="file" id="gltf-upload" accept=".glb,.gltf" class="hidden" />
                </div>
            </div>

            <!-- 2. 재생 중 정보 패널 -->
            <div id="info-panel" class="absolute bottom-10 left-0 w-full px-6 opacity-0 hidden">
                <div class="bg-white/90 backdrop-blur-md rounded-2xl p-5 shadow-xl border-l-4 border-rose-500 pop-up">
                    <p class="text-rose-500 font-bold text-sm mb-1 pulse-text">📍 체크 포인트 <span id="step-count">1</span>/3</p>
                    <h2 id="info-title" class="text-2xl font-extrabold text-gray-800 mb-2">귀 안쪽과 목덜미</h2>
                    <p id="info-desc" class="text-gray-600 text-sm">피부가 얇고 털이 적어 진드기가 가장 좋아하는 곳이에요. 산책 후 꼼꼼히 빗질하며 확인해주세요!</p>
                </div>
            </div>

            <!-- 3. 종료 및 이벤트 참여 화면 -->
            <div id="end-screen" class="pointer-events-auto absolute top-0 left-0 w-full h-full bg-black/70 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center opacity-0 hidden">
                <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl pop-up">
                    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">시청 완료!</h2>
                    <p class="text-gray-600 text-sm mb-6">이제 우리 아이를 진드기로부터<br>안전하게 지켜주세요 🐶</p>
                    
                    <div class="bg-gray-50 rounded-xl p-4 mb-6 border border-gray-100">
                        <p class="font-bold text-gray-800 mb-2 text-sm">🎁 현장 선물 이벤트</p>
                        <p class="text-xs text-gray-500 mb-3">아래 버튼을 눌러 팔로우/구독 후<br>진행 요원에게 보여주시면 선물을 드립니다!</p>
                        
                        <div class="space-y-3">
                            <button onclick="openLink('instagram')" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-purple-500 via-pink-500 to-orange-400 text-white font-bold py-3 rounded-lg shadow hover:opacity-90 transition">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                                인스타그램 팔로우
                            </button>
                            <button onclick="openLink('youtube')" class="w-full flex items-center justify-center gap-2 bg-[#FF0000] text-white font-bold py-3 rounded-lg shadow hover:opacity-90 transition">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                                유튜브 채널 구독
                            </button>
                        </div>
                    </div>
                    <button onclick="resetScene()" class="text-gray-400 text-sm underline hover:text-gray-600">다시 보기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, dogGroup, tickMarkers = [];
        let dogTail; // 꼬리 애니메이션을 위한 참조 변수
        let customModelLoaded = false;
        let animationRequestId;
        
        const container = document.getElementById('canvas-container');

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#e5e7eb');
            scene.fog = new THREE.Fog('#e5e7eb', 10, 30);

            // 모바일 화면 비율에 맞춘 카메라 셋팅
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(10, 8, 10);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 성능 최적화
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 조명 설정
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);

            // 그림자용 투명 바닥
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.ShadowMaterial({ opacity: 0.1 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1.2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 초기 모델 생성
            createCuteVoxelShiba();
            
            window.addEventListener('resize', onWindowResize, false);
            
            // 초기화 완료 후 로딩 끄고 시작화면 표시
            setTimeout(() => {
                document.getElementById('loading-ui').classList.add('hidden');
                document.getElementById('start-screen').classList.remove('hidden');
            }, 500);

            animate();
        }

        // GLTF 로더 인스턴스 생성
        const gltfLoader = new THREE.GLTFLoader();

        function loadCustomModel(url) {
            document.getElementById('loading-ui').classList.remove('hidden');
            document.getElementById('start-screen').classList.add('hidden');

            gltfLoader.load(url, (gltf) => {
                // 기존 Voxel 모델 제거
                if (dogGroup) {
                    scene.remove(dogGroup);
                    tickMarkers.forEach(m => scene.remove(m));
                    tickMarkers = [];
                }

                const model = gltf.scene;
                
                // 그림자 활성화
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                // 모델 크기 정규화 및 중앙 정렬
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                
                // 화면에 맞게 크기 스케일링 (가장 긴 축을 3.5 정도로 맞춤)
                const scale = 3.5 / maxDim;
                model.scale.set(scale, scale, scale);
                
                // 모델의 발이 바닥(-1.0 근처)에 닿도록 위치 조정
                model.position.x = -center.x * scale;
                model.position.y = -box.min.y * scale - 0.5; 
                model.position.z = -center.z * scale;

                // 회전 제어를 용이하게 하기 위해 그룹으로 래핑
                dogGroup = new THREE.Group();
                dogGroup.add(model);
                scene.add(dogGroup);
                
                customModelLoaded = true;
                dogTail = null; // 커스텀 모델은 Voxel용 꼬리 애니메이션 제외

                // 커스텀 모델의 스케일에 맞게 진드기 마커 부착
                createCustomTickMarkers(size, scale);

                document.getElementById('loading-ui').classList.add('hidden');
                startVideoSequence();
            }, undefined, (error) => {
                console.error("GLTF Load Error:", error);
                alert("모델을 불러오는데 실패했습니다. 올바른 GLB/GLTF 파일인지 확인해주세요.");
                document.getElementById('loading-ui').classList.add('hidden');
                document.getElementById('start-screen').classList.remove('hidden');
            });
        }

        function createCustomTickMarkers(size, scale) {
            const markerMat = new THREE.MeshStandardMaterial({
                color: 0xff0000,
                emissive: 0xff0000,
                emissiveIntensity: 0.6,
                transparent: true,
                opacity: 0.8
            });
            const markerGeo = new THREE.SphereGeometry(0.25, 16, 16);

            const h = size.y * scale;
            const w = size.x * scale;
            const d = size.z * scale;

            // 1. 귀 뒤쪽 (상단 위치, 대략적인 비율로 설정)
            const marker1 = new THREE.Mesh(markerGeo, markerMat);
            marker1.position.set(w * 0.15, h * 0.85 - 0.5, d * 0.2); 
            marker1.visible = false;
            dogGroup.add(marker1);
            tickMarkers.push(marker1);

            // 2. 가슴/목덜미 (전면 하단)
            const marker2 = new THREE.Mesh(markerGeo, markerMat);
            marker2.position.set(0, h * 0.3 - 0.5, d * 0.4);
            marker2.visible = false;
            dogGroup.add(marker2);
            tickMarkers.push(marker2);

            // 3. 앞발가락 사이 (바닥면 가까이)
            const marker3 = new THREE.Mesh(markerGeo, markerMat);
            marker3.position.set(w * 0.15, -0.3, d * 0.3);
            marker3.visible = false;
            dogGroup.add(marker3);
            tickMarkers.push(marker3);
        }

        function createCuteVoxelShiba() {
            dogGroup = new THREE.Group();

            // 색상 정의
            const colorOrange = new THREE.MeshStandardMaterial({ color: '#e68a2e', roughness: 0.8 }); // 시바견 주황
            const colorWhite = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.9 });  // 배/주둥이 하양
            const colorBlack = new THREE.MeshStandardMaterial({ color: '#1a1a1a', roughness: 0.5 });  // 코/눈 검정
            const colorPink = new THREE.MeshStandardMaterial({ color: '#ff9999', roughness: 0.6 });   // 귀 안쪽 핑크

            // 1. 몸통 (주황 + 하얀 배)
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.8, 3.8), colorOrange);
            body.position.y = 0.5;
            body.castShadow = true;
            dogGroup.add(body);
            
            const belly = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.81, 3.6), colorWhite);
            belly.position.set(0, 0.4, 0.1);
            dogGroup.add(belly);

            // 2. 머리 그룹
            const headGroup = new THREE.Group();
            headGroup.position.set(0, 1.6, 1.8);
            
            const head = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.8, 1.8), colorOrange);
            head.castShadow = true;
            headGroup.add(head);

            // 주둥이 (하얀색)
            const snout = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 1.0), colorWhite);
            snout.position.set(0, -0.3, 1.2);
            headGroup.add(snout);

            // 코 (까만색)
            const nose = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.2), colorBlack);
            nose.position.set(0, 0.1, 1.7);
            headGroup.add(nose);

            // 눈
            const eyeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.1);
            const eyeR = new THREE.Mesh(eyeGeo, colorBlack);
            eyeR.position.set(0.6, 0.4, 0.95);
            headGroup.add(eyeR);
            const eyeL = new THREE.Mesh(eyeGeo, colorBlack);
            eyeL.position.set(-0.6, 0.4, 0.95);
            headGroup.add(eyeL);

            // 쫑긋한 귀
            const earGeo = new THREE.BoxGeometry(0.5, 0.8, 0.4);
            const earR = new THREE.Mesh(earGeo, colorOrange);
            earR.position.set(0.7, 1.2, -0.2);
            earR.rotation.z = -0.2;
            earR.rotation.x = 0.1;
            headGroup.add(earR);
            
            const earL = new THREE.Mesh(earGeo, colorOrange);
            earL.position.set(-0.7, 1.2, -0.2);
            earL.rotation.z = 0.2;
            earL.rotation.x = 0.1;
            headGroup.add(earL);

            dogGroup.add(headGroup);

            // 3. 다리 (주황색 다리 + 하얀 발)
            const createLeg = (x, z) => {
                const legGroup = new THREE.Group();
                legGroup.position.set(x, -0.4, z);
                
                const legTop = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.6), colorOrange);
                legTop.castShadow = true;
                legGroup.add(legTop);
                
                const paw = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.4, 0.62), colorWhite);
                paw.position.y = -0.4;
                legGroup.add(paw);
                
                return legGroup;
            };

            dogGroup.add(createLeg(0.8, 1.2));   // 앞 우
            dogGroup.add(createLeg(-0.8, 1.2));  // 앞 좌
            dogGroup.add(createLeg(0.8, -1.2));  // 뒤 우
            dogGroup.add(createLeg(-0.8, -1.2)); // 뒤 좌

            // 4. 말린 꼬리
            dogTail = new THREE.Group();
            dogTail.position.set(0, 1.2, -1.8);
            
            const tailMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), colorOrange);
            tailMesh.position.set(0, 0.5, -0.2);
            tailMesh.rotation.x = -Math.PI / 4; // 위로 말려 올라간 각도
            dogTail.add(tailMesh);
            
            const tailTip = new THREE.Mesh(new THREE.BoxGeometry(0.51, 0.4, 0.51), colorWhite);
            tailTip.position.set(0, 1.0, -0.7);
            tailTip.rotation.x = -Math.PI / 4;
            dogTail.add(tailTip);

            dogGroup.add(dogTail);

            scene.add(dogGroup);

            // 모델 생성이 끝난 후 마커 부착
            createTickMarkers();
        }

        function createTickMarkers() {
            const markerMat = new THREE.MeshStandardMaterial({
                color: 0xff0000,
                emissive: 0xff0000,
                emissiveIntensity: 0.6,
                transparent: true,
                opacity: 0.8
            });
            const markerGeo = new THREE.SphereGeometry(0.25, 16, 16);

            // 1. 귀 뒤쪽
            const marker1 = new THREE.Mesh(markerGeo, markerMat);
            marker1.position.set(1.1, 2.5, 1.4); 
            marker1.visible = false;
            dogGroup.add(marker1);
            tickMarkers.push(marker1);

            // 2. 가슴 (로우 앵글 타겟)
            const marker2 = new THREE.Mesh(markerGeo, markerMat);
            marker2.position.set(0.6, 0.3, 1.9);
            marker2.visible = false;
            dogGroup.add(marker2);
            tickMarkers.push(marker2);

            // 3. 앞발가락 사이
            const marker3 = new THREE.Mesh(markerGeo, markerMat);
            marker3.position.set(0.9, -0.6, 1.6);
            marker3.visible = false;
            dogGroup.add(marker3);
            tickMarkers.push(marker3);
        }

        // 카메라 시나리오 좌표 설정 (세로 화면 & Voxel 강아지에 최적화)
        const sequences = [
            {
                camPos: { x: 5.0, y: 4.5, z: 6.5 }, 
                lookAt: { x: 0.5, y: 2.2, z: 1.5 }, 
                title: "1. 귀 안쪽 & 뒤쪽",
                desc: "피부가 얇고 털이 적어 진드기가 가장 쉽게 파고드는 곳이에요.",
                markerIndex: 0,
                duration: 4000
            },
            {
                camPos: { x: 4.0, y: -0.5, z: 6.5 }, // 아래에서 위로 올려다봄
                lookAt: { x: 0.5, y: 0.6, z: 1.8 },  // 가슴쪽 응시
                title: "2. 목덜미 & 가슴",
                desc: "목줄이 닿는 부위나 턱밑, 가슴팍도 진드기가 숨기 좋은 사각지대입니다.",
                markerIndex: 1,
                duration: 4000
            },
            {
                camPos: { x: 4.5, y: 0.5, z: 6.0 }, 
                lookAt: { x: 0.8, y: -0.5, z: 1.5 }, // 발쪽 응시
                title: "3. 발가락 사이",
                desc: "풀밭을 밟는 곳! 산책 후 발바닥과 발가락 사이를 꼼꼼히 확인하세요.",
                markerIndex: 2,
                duration: 4000
            }
        ];

        let isIdle = true;

        function startVideoSequence() {
            document.getElementById('start-screen').classList.add('hidden');
            const infoPanel = document.getElementById('info-panel');
            infoPanel.classList.remove('hidden', 'fade-out');
            infoPanel.classList.add('fade-in');
            
            isIdle = false;

            // ★ 핵심: 강아지 정면 자동 정렬 ★
            const currentY = dogGroup.rotation.y;
            const remainder = currentY % (Math.PI * 2);
            let targetY = currentY - remainder;
            
            // 최단 거리 방향으로 회전 보정
            if (remainder > Math.PI) targetY += Math.PI * 2;
            else if (remainder < -Math.PI) targetY -= Math.PI * 2;

            new TWEEN.Tween(dogGroup.rotation)
                .to({ y: targetY }, 1200) // 1.2초 동안 부드럽게 정면 응시
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            let sequenceDelay = 500; // 정면 도는 시간 약간 기다림

            sequences.forEach((seq, index) => {
                setTimeout(() => {
                    playSequence(seq, index + 1);
                }, sequenceDelay);
                sequenceDelay += seq.duration;
            });

            setTimeout(() => {
                showEndScreen();
            }, sequenceDelay);
        }

        function playSequence(seq, stepNum) {
            tickMarkers.forEach(m => m.visible = false);
            if(tickMarkers[seq.markerIndex]) tickMarkers[seq.markerIndex].visible = true;

            document.getElementById('step-count').innerText = stepNum;
            document.getElementById('info-title').innerText = seq.title;
            document.getElementById('info-desc').innerText = seq.desc;
            
            const infoBox = document.querySelector('#info-panel > div');
            infoBox.classList.remove('pop-up');
            void infoBox.offsetWidth; 
            infoBox.classList.add('pop-up');

            // 카메라 위치 이동
            new TWEEN.Tween(camera.position)
                .to({ x: seq.camPos.x, y: seq.camPos.y, z: seq.camPos.z }, 1500)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();

            // 카메라 시선 이동 (LookAt 보간)
            const lookAtTarget = { x: 0, y: 1.0, z: 0 }; 
            if(stepNum > 1) {
                const prevSeq = sequences[stepNum-2];
                lookAtTarget.x = prevSeq.lookAt.x;
                lookAtTarget.y = prevSeq.lookAt.y;
                lookAtTarget.z = prevSeq.lookAt.z;
            }

            new TWEEN.Tween(lookAtTarget)
                .to({ x: seq.lookAt.x, y: seq.lookAt.y, z: seq.lookAt.z }, 1500)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onUpdate(() => {
                    camera.lookAt(lookAtTarget.x, lookAtTarget.y, lookAtTarget.z);
                })
                .start();
        }

        function showEndScreen() {
            const infoPanel = document.getElementById('info-panel');
            infoPanel.classList.remove('fade-in');
            infoPanel.classList.add('fade-out');
            
            tickMarkers.forEach(m => m.visible = false);

            new TWEEN.Tween(camera.position)
                .to({ x: 10, y: 8, z: 10 }, 2000)
                .easing(TWEEN.Easing.Cubic.InOut)
                .onUpdate(() => camera.lookAt(0,0,0))
                .start();

            setTimeout(() => {
                isIdle = true; 
                const endScreen = document.getElementById('end-screen');
                endScreen.classList.remove('hidden', 'fade-out');
                endScreen.classList.add('fade-in');
            }, 1000);
        }

        function resetScene() {
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            isIdle = true;
            camera.position.set(10, 8, 10);
            camera.lookAt(0,0,0);
            
            // 회전값을 0에 가깝게 초기화
            const currentY = dogGroup.rotation.y;
            dogGroup.rotation.y = currentY % (Math.PI * 2);
        }

        function openLink(type) {
            if(type === 'instagram') {
                window.open('https://instagram.com', '_blank'); 
            } else if (type === 'youtube') {
                window.open('https://youtube.com', '_blank'); 
            }
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);

            if (dogGroup) {
                // 숨쉬기 효과 (몸 전체가 미세하게 위아래로 움직임)
                dogGroup.position.y = Math.sin(time * 0.003) * 0.03;

                if (isIdle) {
                    // 빙글빙글 대기 회전
                    dogGroup.rotation.y += 0.005;
                    // 꼬리 흔들기 효과 (아이들 상태일 때 살랑살랑)
                    if (dogTail) dogTail.rotation.z = Math.sin(time * 0.01) * 0.2;
                } else {
                    // 영상 재생 중에는 꼬리 흔들기 멈춤
                    if (dogTail) dogTail.rotation.z = 0;
                    
                    // 진드기 마커 크기 펄스 효과
                    const scale = 1 + Math.sin(time * 0.005) * 0.2;
                    tickMarkers.forEach(m => {
                        m.scale.set(scale, scale, scale);
                    });
                }
            }

            renderer.render(scene, camera);
        }

        // 시작 버튼 이벤트 연결
        document.getElementById('start-btn').addEventListener('click', startVideoSequence);

        // 커스텀 모델 업로드 이벤트 연결
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('gltf-upload');

        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                loadCustomModel(url);
            }
        });

        // 페이지 로드 완료 시 3D 초기화
        window.onload = init3D;

    </script>
</body>
</html>
