<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>반려동물 진드기 체크</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f3f4f6; }
        #canvas-container { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: relative; z-index: 10; max-width: 430px; margin: 0 auto; height: 100vh; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .pulse-marker {
            width: 20px; height: 20px;
            background: rgba(239, 68, 68, 0.8);
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            animation: pulse 1.5s infinite;
            display: none;
            z-index: 5;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: translate(-50%, -50%) scale(1.5); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .desc-box { transition: opacity 0.5s ease-in-out; }
    </style>
</head>
<body>

    <!-- 3D 렌더링 영역 -->
    <div id="canvas-container"></div>
    
    <!-- HTML 마커 (3D 좌표에 맞춰 이동) -->
    <div id="marker1" class="pulse-marker"></div>
    <div id="marker2" class="pulse-marker"></div>
    <div id="marker3" class="pulse-marker"></div>

    <!-- UI 영역 (모바일 비율 430px 고정) -->
    <div class="ui-layer flex flex-col justify-between p-6">
        
        <!-- 상단 타이틀 & 로딩 -->
        <div class="text-center mt-8 bg-white/80 backdrop-blur-sm p-4 rounded-2xl shadow-sm">
            <h1 class="text-xl font-bold text-gray-800">🐶 진드기 체크 포인트</h1>
            <p class="text-sm text-gray-500 mt-1">주요 호발 부위를 확인하세요</p>
            <div id="loading-indicator" class="mt-3 text-red-500 font-semibold text-sm animate-pulse">
                3D 모델을 불러오는 중입니다...
            </div>
        </div>

        <!-- 하단 설명 & 버튼 영역 -->
        <div class="mb-10">
            <!-- 설명 텍스트 창 -->
            <div id="descBox" class="desc-box opacity-0 bg-gray-800/90 text-white p-5 rounded-2xl mb-4 shadow-lg text-center">
                <p id="descText" class="text-lg font-bold">진드기 확인 부위</p>
            </div>

            <!-- 시작 버튼 -->
            <button id="startBtn" class="pointer-events-auto hidden w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-transform transform hover:scale-105 active:scale-95 text-lg">
                ▶ 교육 영상 시청하기
            </button>

            <!-- 이벤트 모달 (완료 후 표시) -->
            <div id="eventModal" class="hidden pointer-events-auto bg-white p-6 rounded-3xl shadow-2xl text-center border-4 border-red-50">
                <div class="text-4xl mb-3">🎁</div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">교육 완료!</h2>
                <p class="text-gray-600 text-sm mb-5">채널을 추가하고 선물을 받아가세요!</p>
                
                <div class="space-y-3">
                    <button onclick="window.open('https://instagram.com/지원단인스타아이디', '_blank')" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-3 px-4 rounded-xl hover:opacity-90">
                        인스타그램 팔로우
                    </button>
                    <button onclick="window.open('https://youtube.com/@지원단유튜브아이디', '_blank')" class="w-full flex items-center justify-center gap-2 bg-red-600 text-white font-bold py-3 px-4 rounded-xl hover:opacity-90">
                        유튜브 구독하기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Three.js 기본 설정
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#f3f4f6');

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 8); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 조명
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // 2. GLB 파일 로드
        const dogGroup = new THREE.Group();
        scene.add(dogGroup);

        const loader = new THREE.GLTFLoader();
        loader.load(
            '3d puppy.glb', 
            function (gltf) {
                const model = gltf.scene;

                // --- 1. 축 방향 강제 교정 (누워있는 강아지 세우기) ---
                model.rotation.x = -Math.PI / 2; 

                // --- 2. 모델 자동 중앙 정렬 및 크기 맞춤 ---
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                const maxDim = Math.max(size.x, size.y, size.z);
                const targetSize = 3.5; 
                const scale = targetSize / maxDim;
                
                model.scale.setScalar(scale);
                model.position.sub(center.multiplyScalar(scale)); 
                model.position.y -= 0.5; 

                dogGroup.add(model);

                // 로딩 UI 숨기고 시작 버튼 표시
                document.getElementById('loading-indicator').style.display = 'none';
                document.getElementById('startBtn').classList.remove('hidden');
            },
            undefined,
            function (error) {
                console.error('모델 로드 실패:', error);
                document.getElementById('loading-indicator').innerText = '모델을 불러오지 못했습니다. 파일명을 확인해주세요.';
            }
        );

        // 3. 진드기 마커용 3D 좌표
        const markerPositions = [
            new THREE.Vector3(0.8, 1.2, 0.8),   // 귀/목덜미 부근
            new THREE.Vector3(0.5, 0.2, 1.5),   // 가슴/턱밑 부근
            new THREE.Vector3(-0.6, -1.0, 1.2)  // 발/발가락 사이
        ];

        let htmlMarkers = [
            document.getElementById('marker1'),
            document.getElementById('marker2'),
            document.getElementById('marker3')
        ];

        // 애니메이션 상태 관리
        let isAnimating = true;
        let isScenarioRunning = false;

        // 4. 카메라 무빙(Tween.js) 함수
        function moveCamera(targetPos, lookAtPos, duration) {
            return new Promise(resolve => {
                const startPos = camera.position.clone();
                new TWEEN.Tween(startPos)
                    .to(targetPos, duration)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .onUpdate(() => {
                        camera.position.copy(startPos);
                        camera.lookAt(lookAtPos);
                    })
                    .onComplete(resolve)
                    .start();
            });
        }

        // 마커 화면 표시 함수
        function updateMarkerPosition(markerElement, pos3D) {
            const vector = pos3D.clone();
            vector.project(camera);
            const x = (vector.x * .5 + .5) * window.innerWidth;
            const y = (vector.y * -.5 + .5) * window.innerHeight;
            markerElement.style.left = `${x}px`;
            markerElement.style.top = `${y}px`;
        }

        // 텍스트 안내 함수
        const descBox = document.getElementById('descBox');
        const descText = document.getElementById('descText');
        function showDescription(text) {
            descText.innerHTML = text;
            descBox.style.opacity = '1';
        }

        // 5. 시나리오 실행 (시청하기 버튼 클릭)
        document.getElementById('startBtn').addEventListener('click', async () => {
            document.getElementById('startBtn').style.display = 'none';
            isScenarioRunning = true;

            // 모델을 정면으로 부드럽게 정렬
            new TWEEN.Tween(dogGroup.rotation)
                .to({ y: 0 }, 1000)
                .easing(TWEEN.Easing.Quadratic.Out)
                .start();

            await new Promise(r => setTimeout(r, 1000));
            isAnimating = false;

            // Scene 1: 귀 뒤쪽
            showDescription('1. <b>귀 안쪽과 목덜미</b><br>풀숲을 산책할 때 가장 잘 붙어요!');
            await moveCamera(new THREE.Vector3(2.5, 2.5, 4), markerPositions[0], 2000);
            htmlMarkers[0].style.display = 'block';
            await new Promise(r => setTimeout(r, 3000));
            htmlMarkers[0].style.display = 'none';

            // Scene 2: 턱밑/가슴
            showDescription('2. <b>턱 밑과 앞가슴</b><br>털이 촘촘해서 꼼꼼히 만져봐야 해요.');
            await moveCamera(new THREE.Vector3(1.5, -0.5, 3.5), markerPositions[1], 2000);
            htmlMarkers[1].style.display = 'block';
            await new Promise(r => setTimeout(r, 3000));
            htmlMarkers[1].style.display = 'none';

            // Scene 3: 발가락
            showDescription('3. <b>발가락 사이</b><br>산책 후 발을 닦이며 꼭 확인하세요!');
            await moveCamera(new THREE.Vector3(-2, -1, 3.5), markerPositions[2], 2000);
            htmlMarkers[2].style.display = 'block';
            await new Promise(r => setTimeout(r, 3000));
            htmlMarkers[2].style.display = 'none';

            // 원상복구 및 모달 팝업
            descBox.style.opacity = '0';
            await moveCamera(new THREE.Vector3(0, 2, 8), new THREE.Vector3(0, 0, 0), 2000);
            isAnimating = true;
            document.getElementById('eventModal').classList.remove('hidden');
        });

        // 렌더링 루프
        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();

            // 대기 상태일 때 빙글빙글 회전
            if (isAnimating) {
                dogGroup.rotation.y += 0.01;
            }

            // 시나리오 중일 때 마커 화면 좌표 지속 업데이트
            if (isScenarioRunning) {
                if(htmlMarkers[0].style.display === 'block') updateMarkerPosition(htmlMarkers[0], markerPositions[0]);
                if(htmlMarkers[1].style.display === 'block') updateMarkerPosition(htmlMarkers[1], markerPositions[1]);
                if(htmlMarkers[2].style.display === 'block') updateMarkerPosition(htmlMarkers[2], markerPositions[2]);
            }

            renderer.render(scene, camera);
        }
        animate();

        // 창 크기 조절 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
