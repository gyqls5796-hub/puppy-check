<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 좌표 추출기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; color: white; font-family: sans-serif; }
        #info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; z-index: 10; font-size: 16px; line-height: 1.5; pointer-events: none; }
        .coord { color: #4ade80; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>🎯 진드기 마커 좌표 찾기</h3>
        <p>1. 마우스(터치)로 강아지를 돌리고 확대해보세요.</p>
        <p>2. 원하는 부위(귀, 가슴, 발가락)를 클릭하세요.</p>
        <hr style="margin:10px 0; border-color:#555;">
        <p>선택된 좌표: <br><span id="coordDisplay" class="coord">아직 클릭하지 않음</span></p>
    </div>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // 모델 로드 (똑바로 세우기 적용)
        const dogGroup = new THREE.Group();
        scene.add(dogGroup);

        const loader = new THREE.GLTFLoader();
        loader.load('3d puppy.glb', function (gltf) {
            const model = gltf.scene;
            model.rotation.x = -Math.PI / 2; // 강아지 세우기
            
            const wrapper = new THREE.Group();
            wrapper.add(model);
            wrapper.rotation.y = Math.PI / 2; // 정면 보기

            const box = new THREE.Box3().setFromObject(wrapper);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            const scale = 3.5 / Math.max(size.x, size.y, size.z);
            wrapper.scale.setScalar(scale);
            wrapper.position.sub(center.multiplyScalar(scale)); 
            wrapper.position.y -= 0.5; 

            dogGroup.add(wrapper);
        });

        // 클릭 좌표 추출 (Raycaster)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        // 클릭한 곳에 임시로 빨간 공 생성
        const sphereGeo = new THREE.SphereGeometry(0.1, 16, 16);
        const sphereMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        let tempMarker = null;

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(dogGroup, true);

            if (intersects.length > 0) {
                const pt = intersects[0].point;
                document.getElementById('coordDisplay').innerText = 
                    `x: ${pt.x.toFixed(2)}, y: ${pt.y.toFixed(2)}, z: ${pt.z.toFixed(2)}`;
                
                if (tempMarker) scene.remove(tempMarker);
                tempMarker = new THREE.Mesh(sphereGeo, sphereMat);
                tempMarker.position.copy(pt);
                scene.add(tempMarker);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
