<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>반려동물 진드기 체크 & 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f3f4f6; user-select: none; -webkit-user-select: none; }
        #canvas-container { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: relative; z-index: 10; max-width: 430px; margin: 0 auto; height: 100vh; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* 기본 진드기 마커 스타일 */
        .tick-marker {
            position: absolute;
            display: none;
            z-index: 20;
            cursor: pointer;
            --rot: 0deg;
            --scale: 1;
        }

        /* [영상 모드] - 강조 표시 */
        .tick-marker.video-mode {
            width: 65px;
            height: 65px;
            background-image: url('tick.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: bounce-tick 0.8s infinite alternate;
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.8)) drop-shadow(0 0 12px rgba(255, 0, 0, 0.6));
        }

        .tick-marker.video-mode::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            background: rgba(239, 68, 68, 0.25);
            border: 2px solid rgba(239, 68, 68, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulse-ring 1.2s infinite ease-out;
        }

        /* [게임 모드] - 은폐 스타일 */
        .tick-marker.game-mode {
            width: 44px;
            height: 44px;
            background-image: url('tick.png');
            background-size: 14px 14px;
            background-repeat: no-repeat;
            background-position: center;
            transform: translate(-50%, -50%) rotate(var(--rot)) scale(var(--scale));
            filter: none;
            animation: none;
        }

        .tick-marker.game-mode::after {
            display: none;
        }

        @keyframes bounce-tick {
            0% { transform: translate(-50%, -50%) rotate(var(--rot)) scale(var(--scale)); }
            100% { transform: translate(-50%, -50%) rotate(var(--rot)) scale(calc(var(--scale) * 1.2)); }
        }

        @keyframes pulse-ring {
            0% { width: 100%; height: 100%; opacity: 1; }
            100% { width: 200%; height: 200%; opacity: 0; }
        }

        .desc-box { transition: opacity 0.5s ease-in-out; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="marker1" class="tick-marker pointer-events-auto"></div>
    <div id="marker2" class="tick-marker pointer-events-auto"></div>
    <div id="marker3" class="tick-marker pointer-events-auto"></div>
    <div id="marker4" class="tick-marker pointer-events-auto"></div>
    <div id="marker5" class="tick-marker pointer-events-auto"></div>

    <div class="ui-layer flex flex-col justify-between p-6">
        <!-- 상단 헤더 영역 -->
        <div class="mt-4 space-y-2">
            <!-- 타이틀 카드 -->
            <div class="text-center bg-white/90 backdrop-blur-sm p-3.5 rounded-2xl shadow-sm border border-gray-100">
                <h1 class="text-lg font-bold text-gray-800 flex items-center justify-center gap-1">
                    🐶 진드기 체크 포인트
                </h1>
                <p id="subTitle" class="text-xs text-gray-500 mt-0.5">주요 호발 부위를 확인하고 퇴치하세요</p>
                
                <div id="gameScoreBoard" class="hidden mt-2 pt-2 border-t border-gray-100 flex justify-around items-center">
                    <div class="text-xs font-semibold text-gray-600">남은 진드기</div>
                    <div class="text-lg font-black text-red-500"><span id="remainCount">5</span> / 5</div>
                </div>

                <div id="loading-indicator" class="mt-2 text-red-500 font-semibold text-xs animate-pulse">
                    3D 모델을 준비하고 있습니다...
                </div>
            </div>

            <!-- 성별 / 연령 선택 드롭박스 카드 -->
            <div id="userInfoSection" class="pointer-events-auto bg-white/90 backdrop-blur-sm p-3 rounded-2xl shadow-sm border border-gray-100 grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 mb-1">성별</label>
                    <select id="genderSelect" class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-xs rounded-xl p-2 focus:ring-2 focus:ring-amber-400 focus:outline-none">
                        <option value="">선택해주세요</option>
                        <option value="남성">남성</option>
                        <option value="여성">여성</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 mb-1">연령대</label>
                    <select id="ageSelect" class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-xs rounded-xl p-2 focus:ring-2 focus:ring-amber-400 focus:outline-none">
                        <option value="">선택해주세요</option>
                        <option value="10대 이하">10대 이하</option>
                        <option value="20대">20대</option>
                        <option value="30대">30대</option>
                        <option value="40대">40대</option>
                        <option value="50대">50대</option>
                        <option value="60대">60대</option>
                        <option value="70대 이상">70대 이상</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 하단 영역 (버튼 및 로고) -->
        <div class="mb-4">
            <div id="descBox" class="desc-box opacity-0 bg-gray-900/90 text-white p-4 rounded-2xl mb-3 shadow-lg text-center border border-gray-700">
                <p id="descText" class="text-base font-semibold leading-relaxed"></p>
            </div>

            <!-- 시작 메뉴 버튼 & 로고 -->
            <div id="menuButtons" class="hidden flex flex-col items-center pointer-events-auto">
                <div class="w-full space-y-2 mb-3">
                    <button id="startGameBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg transition-all active:scale-95 text-base flex items-center justify-center gap-2 opacity-50 cursor-not-allowed">
                        🎮 숨은 진드기 잡기 게임
                    </button>
                    <button id="startVideoBtn" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 px-4 rounded-2xl shadow-md transition-all active:scale-95 text-sm flex items-center justify-center gap-2 opacity-50 cursor-not-allowed">
                        ▶ 반려동물 진드기 체크 부위 확인하기
                    </button>
                </div>
                <!-- 첫 화면 하단 지원단 로고 -->
                <div class="flex justify-center items-center py-2">
                    <img src="logo.png" alt="지원단 로고" class="h-14 max-w-[280px] w-auto object-contain drop-shadow-sm opacity-95" onerror="this.style.display='none'">
                </div>
            </div>

            <!-- 최종 이벤트 모달 (공용) -->
            <div id="eventModal" class="hidden pointer-events-auto bg-white p-6 rounded-3xl shadow-2xl text-center border-4 border-red-50">
                <div class="text-4xl mb-2">🎉</div>
                <h2 id="modalTitle" class="text-2xl font-black text-gray-800 mb-1">모두 완료!</h2>
                <p id="modalDesc" class="text-gray-600 text-xs mb-4">선물 수령을 위해 아래 채널을 추가해 주세요!</p>
                
                <div class="space-y-2.5">
                    <button id="instaBtn" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-3 px-4 rounded-xl hover:opacity-90 shadow-md text-sm active:scale-95">
                        인스타그램 팔로우
                    </button>
                    <button id="youtubeBtn" class="w-full flex items-center justify-center gap-2 bg-red-600 text-white font-bold py-3 px-4 rounded-xl hover:opacity-90 shadow-md text-sm active:scale-95">
                        유튜브 구독하기
                    </button>
                    
                    <button onclick="window.open('http://gncdc.or.kr/', '_blank')" title="경상남도감염병관리지원단 홈페이지 바로가기" class="w-full flex items-center justify-center bg-white border border-gray-200 hover:border-gray-300 hover:bg-gray-50 py-3 px-4 rounded-xl shadow-sm transition-all active:scale-95">
                        <img src="logo.png" alt="경상남도감염병관리지원단 홈페이지 이동" class="h-10 max-w-[260px] w-auto object-contain">
                    </button>
                    
                    <button id="replayBtn" class="w-full flex items-center justify-center gap-2 bg-gray-600 text-white font-bold py-2.5 px-4 rounded-xl hover:bg-gray-700 text-xs mt-1">
                        🔄 처음으로 돌아가기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycby2irHshS-7F04tlUAipYDwJhHdsyq4RgIMtAyhV4WyFiCnhc4Q-0MW7JBLZmRhudf8RA/exec';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#f3f4f6');

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0.5, 8); 
        camera.lookAt(0, -0.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, -0.5, 0);
        controls.minDistance = 2.0;
        controls.maxDistance = 10;
        controls.enabled = false;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        const dogGroup = new THREE.Group();
        scene.add(dogGroup);

        const loader = new THREE.GLTFLoader();
        loader.load(
            '3d puppy.glb', 
            function (gltf) {
                const model = gltf.scene;
                model.rotation.x = -Math.PI / 2; 
                const wrapper = new THREE.Group();
                wrapper.add(model);
                wrapper.rotation.y = Math.PI / 2; 

                const box = new THREE.Box3().setFromObject(wrapper);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                const maxDim = Math.max(size.x, size.y, size.z);
                const targetSize = 3.5; 
                const scale = targetSize / maxDim;
                
                wrapper.scale.setScalar(scale);
                wrapper.position.sub(center.multiplyScalar(scale)); 
                wrapper.position.y -= 0.5; 

                dogGroup.add(wrapper);

                document.getElementById('loading-indicator').style.display = 'none';
                document.getElementById('menuButtons').classList.remove('hidden');
            },
            undefined,
            function (error) {
                console.error('모델 로드 실패:', error);
                document.getElementById('loading-indicator').innerText = '모델 로드 실패. 파일명을 확인하세요.';
            }
        );

        const markerPositions = [
            new THREE.Vector3(1.18, 0.70, -0.21),
            new THREE.Vector3(1.12, -0.10, 0.04),
            new THREE.Vector3(0.73, -1.81, -0.22),
            new THREE.Vector3(-1.35, -0.50, 0.0),
            new THREE.Vector3(-0.08, -0.28, -0.39)
        ];

        // [수정됨] 제목을 개나리색(text-yellow-400)으로 강조하고 4, 5번 줄바꿈 및 문구 적용
        const markerDescriptions = [
            '<span class="text-yellow-400 font-bold text-base block mb-0.5">1. 귀 뒤 또는 귀 속</span>풀숲을 산책할 때 가장 먼저 닿는 곳이에요.',
            '<span class="text-yellow-400 font-bold text-base block mb-0.5">2. 목 주변</span>목걸이나 하네스 안쪽을 잘 살펴보세요.',
            '<span class="text-yellow-400 font-bold text-base block mb-0.5">3. 발가락 사이</span>산책 후 발바닥을 닦으며 꼼꼼히 확인하세요!',
            '<span class="text-yellow-400 font-bold text-base block mb-0.5">4. 꼬리 밑동과 사타구니</span>꼬리와 항문 주변 및 사타구니 등<br>피부가 연한 곳에 잘 숨어요.',
            '<span class="text-yellow-400 font-bold text-base block mb-0.5">5. 몸 전체 확인</span>털 안쪽 피부를 전체적으로<br>꼼꼼히 살펴보세요.'
        ];

        let htmlMarkers = [
            document.getElementById('marker1'),
            document.getElementById('marker2'),
            document.getElementById('marker3'),
            document.getElementById('marker4'),
            document.getElementById('marker5')
        ];

        let isIdle = true;
        let isVideoMode = false;
        let isGameMode = false;
        let activeTickFlags = [false, false, false, false, false];
        let remainTicks = 5;

        let userGender = '';
        let userAge = '';
        const genderSelect = document.getElementById('genderSelect');
        const ageSelect = document.getElementById('ageSelect');
        const startGameBtn = document.getElementById('startGameBtn');
        const startVideoBtn = document.getElementById('startVideoBtn');
        const userInfoSection = document.getElementById('userInfoSection');

        function checkInputsValid() {
            userGender = genderSelect.value;
            userAge = ageSelect.value;
            const isValid = (userGender !== '') && (userAge !== '');

            if (isValid) {
                startGameBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                startVideoBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                startGameBtn.classList.add('opacity-50', 'cursor-not-allowed');
                startVideoBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
            return isValid;
        }

        genderSelect.addEventListener('change', checkInputsValid);
        ageSelect.addEventListener('change', checkInputsValid);

        function sendStatsToGoogleSheet(choiceType) {
            if (!GOOGLE_SHEET_WEBAPP_URL) return;

            fetch(GOOGLE_SHEET_WEBAPP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    gender: userGender || '미선택',
                    age: userAge || '미선택',
                    choice: choiceType
                })
            }).catch(err => console.error('전송 실패:', err));
        }

        document.getElementById('instaBtn').addEventListener('click', () => {
            sendStatsToGoogleSheet('인스타그램');
            window.open('https://www.instagram.com/gncdc_2019/', '_blank');
        });

        document.getElementById('youtubeBtn').addEventListener('click', () => {
            sendStatsToGoogleSheet('유튜브');
            window.open('https://www.youtube.com/@%EA%B2%BD%EC%83%81%EB%82%A8%EB%8F%84%EA%B0%90%EC%97%BC%EB%B3%91%EA%B4%80%EB%A6%AC%EC%A7%80', '_blank');
        });

        const occlusionRaycaster = new THREE.Raycaster();

        function moveCamera(targetPos, lookAtPos, duration) {
            return new Promise(resolve => {
                const startPos = camera.position.clone();
                new TWEEN.Tween(startPos)
                    .to(targetPos, duration)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .onUpdate(() => {
                        camera.position.copy(startPos);
                        camera.lookAt(lookAtPos);
                    })
                    .onComplete(() => {
                        camera.lookAt(lookAtPos);
                        resolve();
                    })
                    .start();
            });
        }

        function updateMarkerPosition(markerElement, localPos) {
            const worldPos = localPos.clone().applyMatrix4(dogGroup.matrixWorld);
            const toMarker = worldPos.clone().sub(camera.position);
            const dist = toMarker.length();
            const dir = toMarker.clone().normalize();
            
            const camDir = new THREE.Vector3();
            camera.getWorldDirection(camDir);
            if (dir.dot(camDir) <= 0) {
                markerElement.style.display = 'none';
                return;
            }

            // 영상 모드에서는 가림 판정(Occlusion)을 무시하여 파묻힌 마커도 확실히 보이도록 보장
            // 게임 모드에서만 모델 피부 두께를 고려해 허용 오차(0.45) 적용
            if (isGameMode) {
                occlusionRaycaster.set(camera.position, dir);
                const intersects = occlusionRaycaster.intersectObject(dogGroup, true);
                if (intersects.length > 0 && intersects[0].distance < dist - 0.45) {
                    markerElement.style.display = 'none';
                    return;
                }
            }

            const dynamicScale = Math.min(Math.max(6.0 / dist, 0.8), 3.0);
            markerElement.style.setProperty('--scale', dynamicScale.toFixed(2));

            const vector = worldPos.clone().project(camera);
            const x = (vector.x * .5 + .5) * window.innerWidth;
            const y = (vector.y * -.5 + .5) * window.innerHeight;
            markerElement.style.left = `${x}px`;
            markerElement.style.top = `${y}px`;
            markerElement.style.display = 'block';
        }

        const descBox = document.getElementById('descBox');
        const descText = document.getElementById('descText');
        function showDescription(text) {
            descText.innerHTML = text;
            descBox.style.opacity = '1';
        }

        // 1. 체크 부위 확인 영상 모드
        async function runVideoMode() {
            if (!checkInputsValid()) {
                alert('상단에서 성별과 연령대를 먼저 선택해주세요!');
                return;
            }

            document.getElementById('menuButtons').classList.add('hidden');
            userInfoSection.classList.add('hidden');
            document.getElementById('eventModal').classList.add('hidden');
            isIdle = false;
            isVideoMode = true;
            controls.enabled = false;

            htmlMarkers.forEach(m => {
                m.classList.remove('game-mode');
                m.classList.add('video-mode');
            });

            new TWEEN.Tween(dogGroup.rotation)
                .to({ y: 0 }, 1000)
                .easing(TWEEN.Easing.Quadratic.Out)
                .start();
            await new Promise(r => setTimeout(r, 1000));

            const cameraAngles = [
                new THREE.Vector3(2.5, 1.2, 3.5),
                new THREE.Vector3(2.5, -0.2, 3.5),
                new THREE.Vector3(2.0, -1.5, 3.5),
                new THREE.Vector3(-3.0, -0.5, 3.0),
                new THREE.Vector3(0, 0.5, 6.0)
            ];

            for (let i = 0; i < 5; i++) {
                showDescription(markerDescriptions[i]);
                await moveCamera(cameraAngles[i], markerPositions[i], 1800);
                activeTickFlags[i] = true;
                htmlMarkers[i].style.setProperty('--rot', Math.floor(Math.random() * 360) + 'deg');
                await new Promise(r => setTimeout(r, 2500));
                activeTickFlags[i] = false;
                htmlMarkers[i].style.display = 'none';
            }

            descBox.style.opacity = '0';
            await moveCamera(new THREE.Vector3(0, 0.5, 8), new THREE.Vector3(0, -0.5, 0), 1800);
            
            isVideoMode = false;
            isIdle = true;
            
            // 영상 모드 완료 시 모달 팝업
            document.getElementById('modalTitle').innerText = '교육 완료!';
            document.getElementById('eventModal').classList.remove('hidden');
        }

        // 2. 숨은 진드기 잡기 게임 모드
        async function runGameMode() {
            if (!checkInputsValid()) {
                alert('상단에서 성별과 연령대를 먼저 선택해주세요!');
                return;
            }

            document.getElementById('menuButtons').classList.add('hidden');
            userInfoSection.classList.add('hidden');
            document.getElementById('eventModal').classList.add('hidden');
            isIdle = false;
            isGameMode = true;
            controls.enabled = true;
            
            remainTicks = 5;
            document.getElementById('remainCount').innerText = remainTicks;
            document.getElementById('gameScoreBoard').classList.remove('hidden');

            htmlMarkers.forEach(m => {
                m.classList.remove('video-mode');
                m.classList.add('game-mode');
            });

            new TWEEN.Tween(dogGroup.rotation)
                .to({ y: 0 }, 800)
                .easing(TWEEN.Easing.Quadratic.Out)
                .start();
            await moveCamera(new THREE.Vector3(0, 0.5, 6), new THREE.Vector3(0, -0.5, 0), 800);

            showDescription('강아지를 돌리고 확대해보며 숨은 진드기 5마리를 찾아 터치하세요!');

            for (let i = 0; i < 5; i++) {
                activeTickFlags[i] = true;
                htmlMarkers[i].style.setProperty('--rot', Math.floor(Math.random() * 360) + 'deg');
            }
        }

        htmlMarkers.forEach((marker, index) => {
            marker.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!isGameMode || !activeTickFlags[index]) return;

                activeTickFlags[index] = false;
                marker.style.display = 'none';

                remainTicks--;
                document.getElementById('remainCount').innerText = remainTicks;

                if (remainTicks === 0) {
                    endGame();
                } else {
                    showDescription(`진드기를 잡았습니다! 남은 진드기: ${remainTicks}마리`);
                }
            });
        });

        // 게임 완료 시 모달 팝업
        async function endGame() {
            isGameMode = false;
            controls.enabled = false;
            document.getElementById('gameScoreBoard').classList.add('hidden');
            descBox.style.opacity = '0';

            await moveCamera(new THREE.Vector3(0, 0.5, 8), new THREE.Vector3(0, -0.5, 0), 1200);
            isIdle = true;

            document.getElementById('modalTitle').innerText = '진드기 완벽 퇴치!';
            document.getElementById('eventModal').classList.remove('hidden');
        }

        function resetToHome() {
            document.getElementById('eventModal').classList.add('hidden');
            document.getElementById('gameScoreBoard').classList.add('hidden');
            userInfoSection.classList.remove('hidden');
            descBox.style.opacity = '0';
            
            for (let i = 0; i < 5; i++) {
                activeTickFlags[i] = false;
                htmlMarkers[i].style.display = 'none';
                htmlMarkers[i].classList.remove('game-mode', 'video-mode');
            }

            // 선택값 초기화
            genderSelect.value = '';
            ageSelect.value = '';
            userGender = '';
            userAge = '';

            controls.enabled = false;
            camera.position.set(0, 0.5, 8);
            camera.lookAt(0, -0.5, 0);
            controls.target.set(0, -0.5, 0);

            isIdle = true;
            isVideoMode = false;
            isGameMode = false;
            
            document.getElementById('menuButtons').classList.remove('hidden');
            checkInputsValid();
        }

        document.getElementById('startVideoBtn').addEventListener('click', runVideoMode);
        document.getElementById('startGameBtn').addEventListener('click', runGameMode);
        document.getElementById('replayBtn').addEventListener('click', resetToHome);

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();

            if (isIdle) {
                dogGroup.rotation.y += 0.005;
            }

            if (controls.enabled) {
                controls.update();
            }

            if (isVideoMode || isGameMode) {
                for (let i = 0; i < 5; i++) {
                    if (activeTickFlags[i]) {
                        updateMarkerPosition(htmlMarkers[i], markerPositions[i]);
                    }
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
